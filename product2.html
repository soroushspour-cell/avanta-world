<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avanta World | Spices</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--red:#ff2929;
--orange:#ff7900;
--yellow:#ffd500;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;
overflow-x:hidden;
background:
radial-gradient(circle at 15% 15%,#641400,transparent 42%),
radial-gradient(circle at 85% 80%,#7c2600,transparent 42%),
#160706;
background-size:200% 200%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%,100%{background-position:0% 0%}
50%{background-position:100% 100%}
}

#particles{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.particle{
position:absolute;
bottom:-30px;
border-radius:50%;
opacity:0;
animation:floatUp linear infinite;
filter:blur(.5px);
}

@keyframes floatUp{
0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
10%{opacity:.8}
80%{opacity:.55}
100%{transform:translateY(-110vh) translateX(90px) rotate(600deg);opacity:0}
}

header{
position:relative;
z-index:5;
padding:22px 5%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
background:rgba(40,10,5,.55);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,125,20,.25);
}

.logo{
font-size:27px;
font-weight:900;
letter-spacing:2px;
background:linear-gradient(90deg,#ff2929,#ff9b00,#ffe600,#ff2929);
background-size:300%;
-webkit-background-clip:text;
color:transparent;
animation:logoShine 4s linear infinite;
}

@keyframes logoShine{
to{background-position:300% center}
}

nav{display:flex;gap:24px}
nav a{
color:#ffe1c2;
text-decoration:none;
transition:.3s;
}
nav a:hover{
color:var(--yellow);
text-shadow:0 0 15px var(--orange);
}

.hero{
position:relative;
z-index:1;
text-align:center;
padding:65px 20px 45px;
}

.hero h1{
font-size:clamp(45px,8vw,75px);
font-weight:1000;
background:linear-gradient(90deg,#ff2525,#ff7900,#ffe000,#ff2525);
background-size:300% auto;
-webkit-background-clip:text;
color:transparent;
animation:titleGlow 4s linear infinite;
}

@keyframes titleGlow{
0%{background-position:0%;filter:drop-shadow(0 0 8px #ff3900)}
50%{background-position:100%;filter:drop-shadow(0 0 28px #ff9b00)}
100%{background-position:200%;filter:drop-shadow(0 0 8px #ff3900)}
}

.hero p{
margin-top:16px;
color:#ffc59a;
font-size:16px;
animation:fadeUp 1.2s ease both;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.products{
position:relative;
z-index:1;
width:92%;
max-width:1600px;
margin:auto;
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:22px;
padding:20px 0 75px;
}

.card{
position:relative;
overflow:hidden;
border-radius:20px;
background:linear-gradient(145deg,rgba(255,100,20,.15),rgba(70,10,5,.5));
border:1px solid rgba(255,145,30,.3);
backdrop-filter:blur(12px);
opacity:0;
animation:cardReveal .8s cubic-bezier(.2,.8,.2,1) forwards;
animation-delay:var(--delay,0s);
transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;
}

@keyframes cardReveal{
from{opacity:0;transform:translateY(45px) scale(.88);filter:blur(5px)}
to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

.card:hover{
transform:translateY(-12px) scale(1.035);
border-color:#ffb000;
box-shadow:
0 20px 45px rgba(0,0,0,.5),
0 0 25px rgba(255,70,0,.35),
0 0 45px rgba(255,180,0,.13);
z-index:2;
}

.card::before{
content:"";
position:absolute;
z-index:3;
top:-50%;
left:-120%;
width:65%;
height:200%;
background:linear-gradient(90deg,transparent,rgba(255,220,120,.22),transparent);
transform:rotate(25deg);
pointer-events:none;
}

.card:hover::before{animation:lightSweep .8s ease}

@keyframes lightSweep{
from{left:-120%}
to{left:150%}
}

.product-link{
color:inherit;
text-decoration:none;
display:block;
height:100%;
}

.product-image{
width:100%;
aspect-ratio:1/1;
background:rgba(255,160,50,.07);
overflow:hidden;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
padding:10px;
transition:transform .55s cubic-bezier(.2,.8,.2,1);
}

.card:hover .product-image img{
transform:scale(1.12) rotate(2deg);
}

.info{padding:15px}

.name{
font-size:15px;
font-weight:bold;
line-height:1.5;
min-height:44px;
}

.brand{
font-size:12px;
color:#ffc39a;
margin-top:7px;
}

.price{
margin-top:11px;
color:#ffd500;
font-weight:bold;
font-size:16px;
text-shadow:0 0 10px rgba(255,190,0,.3);
}

.coming{
min-height:260px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
background:linear-gradient(145deg,rgba(160,30,0,.22),rgba(255,130,0,.1));
}

.star{
font-size:43px;
margin-bottom:20px;
color:#ffd500;
filter:drop-shadow(0 0 13px #ff5b00);
animation:starDance 2.5s ease-in-out infinite;
}

@keyframes starDance{
0%,100%{transform:translateY(0) rotate(0) scale(1)}
50%{transform:translateY(-14px) rotate(180deg) scale(1.2)}
}

.coming-title{
font-size:17px;
font-weight:900;
letter-spacing:3px;
color:#ffbd28;
animation:comingGlow 2s ease-in-out infinite alternate;
}

@keyframes comingGlow{
from{text-shadow:0 0 5px #ff3000}
to{text-shadow:0 0 20px #ffb000,0 0 30px #ff4b00}
}

.coming-text{
margin-top:12px;
font-size:13px;
line-height:1.7;
color:#ffc59a;
}

footer{
position:relative;
z-index:1;
border-top:1px solid rgba(255,125,20,.2);
padding:32px 20px;
text-align:center;
color:#d5a68a;
background:rgba(40,10,5,.4);
}

footer a{
display:inline-block;
margin-top:12px;
color:#ffb52b;
text-decoration:none;
transition:.3s;
}

footer a:hover{
transform:translateY(-3px);
text-shadow:0 0 12px #ff7800;
}

@media(max-width:1100px){
.products{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media(max-width:750px){
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
header{justify-content:center}
nav{justify-content:center}
.hero{padding-top:42px}
.coming{min-height:220px}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
}
}
</style>
</head>

<body>

<div id="particles"></div>

<header>
<div class="logo">AVANTA WORLD</div>
<nav>
<a href="index.html">Home</a>
<a href="index.html#categories">Categories</a>
</nav>
</header>

<section class="hero">
<h1>Spices</h1>
<p>Spices, seeds and cooking ingredients by Mamami.</p>
</section>

<div class="products" id="products"></div>

<footer>
<p>© 2026 Avanta World</p>
<a href="index.html">Back to Home</a>
</footer>

<script>
/* Floating spice particles */

const particleBox=document.getElementById("particles");

const particleColors=[
"#ff2600",
"#ff6a00",
"#ffb000",
"#ffdc36",
"#d94b18"
];

for(let i=0;i<75;i++){
const p=document.createElement("span");
p.className="particle";

const size=2+Math.random()*6;

p.style.width=size+"px";
p.style.height=size+"px";
p.style.left=Math.random()*100+"%";
p.style.background=particleColors[
Math.floor(Math.random()*particleColors.length)
];
p.style.animationDuration=(7+Math.random()*12)+"s";
p.style.animationDelay=(-Math.random()*18)+"s";

particleBox.appendChild(p);
}

/* Official Mamami products */

const products=[
{
name:"Mamami Organic Premium Turmeric Powder 100g",
brand:"Mamami",
price:"RM 38.90",
image:"https://www.mamami4u.com/cdn/shop/files/Mamami_Organic_Premium_Turmeric_Powder_100g.png?v=1784366385&width=533",
link:"https://www.mamami4u.com/products/mamami-premium-tumeric-powder-100g"
},
{
name:"Mamami Organic Wave Black Kampot Pepper 80g",
brand:"Mamami",
price:"RM 23.90",
image:"https://www.mamami4u.com/cdn/shop/files/BlackPepper.webp?v=1787073858&width=533",
link:"https://www.mamami4u.com/products/organic-wave-kampot-black-pepper-80g"
},
{
name:"Mamami Pandan Leaf Powder 100g",
brand:"Mamami",
price:"RM 19.90",
image:"https://www.mamami4u.com/cdn/shop/files/PandanLeafPowderFront.png?v=1791379831&width=533",
link:"https://www.mamami4u.com/zh/products/mamami-pandan-leaf-powder-100g"
},
{
name:"Mamami Organic Wave Chia Seeds 200g",
brand:"Mamami",
price:"RM 19.90",
image:"https://www.mamami4u.com/cdn/shop/files/ChiaSeeds.webp?v=1787078120&width=533",
link:"https://www.mamami4u.com/products/mamami-organic-chia-seed"},
{
name:"Mamami Organic Brown Flaxseed 200g",
brand:"Mamami",
price:"RM 5.50",
image:"https://www.mamami4u.com/cdn/shop/files/BrownFlaxseed_1.webp?v=1787077201&width=533",
link:"https://www.mamami4u.com/products/organic-brown-flaxseed"
},
{
name:"Mamami Organic Wave Black Sesame Seeds 100g",
brand:"Mamami",
price:"RM 16.90",
image:"https://www.mamami4u.com/cdn/shop/files/BlackSesameSeed_100g.webp?v=1787076285&width=533",
link:"https://www.mamami4u.com/products/mamami-organic-wave-black-sesame-seeds-100g"
},
{
name:"Mamami Premium Japanese Black Sesame Seeds 100g",
brand:"Mamami",
price:"RM 15.90",
image:"https://www.mamami4u.com/cdn/shop/files/Premium_Japanese_Black_Sesame_Seeds_100g.png?v=1785397191&width=533",
link:"https://www.mamami4u.com/products/mamami-premium-japanese-black-sesame-seeds-100g"
},
{
name:"Mamami Organic Wave Roasted Golden Sesame Seeds 100g",
brand:"Mamami",
price:"RM 15.90",
image:"https://www.mamami4u.com/cdn/shop/files/RoastedGoldenSesameSeedsFront.png?v=1791375523&width=533",
link:"https://www.mamami4u.com/products/mamami-organic-wave-roasted-golden-sesame-seeds-100g"
},
{
name:"Mamami Organic Wave Roasted White Sesame Seeds 100g",
brand:"Mamami",
price:"RM 10.90",
image:"https://www.mamami4u.com/cdn/shop/files/RoastedWhiteSesameSeeds.png?v=1791379070&width=533",
link:"https://www.mamami4u.com/products/mamami-organic-wave-roasted-white-sesame-seeds-100g"
},
{
name:"Mamami Organic Wave Black Sesame Powder 150g",
brand:"Mamami",
price:"RM 18.90",
image:"https://www.mamami4u.com/cdn/shop/files/Mamami_Organic_Wave_Black_Sesame_Powder_150g.png?v=1784388519&width=533",
link:"https://www.mamami4u.com/products/organic-wave-roasted-black-sesame-powder-150g"
},
{
name:"Mamami Organic Wave Roasted Golden Sesame Powder 120g",
brand:"Mamami",
price:"RM 18.90",
image:"https://www.mamami4u.com/cdn/shop/files/RoastedGoldenSesamePowderFront.png?v=1791376749&width=533",
link:"https://www.mamami4u.com/products/mamami-organic-wave-roasted-golden-sesame-powder-120g"
}
];

const grid=document.getElementById("products");

products.forEach((product,index)=>{
const card=document.createElement("div");
card.className="card";
card.style.setProperty("--delay",(index*.06)+"s");

card.innerHTML=`
<a class="product-link"
href="${product.link}"
target="_blank"
rel="noopener noreferrer">

<div class="product-image">
<img
src="${product.image}"
alt="${product.name}"
loading="lazy"
>
</div>

<div class="info">
<div class="name">${product.name}</div>
<div class="brand">${product.brand}</div>
<div class="price">${product.price}</div>
</div>

</a>
`;

grid.appendChild(card);
});

/* Exactly 45 Coming Soon cards */

for(let i=0;i<45;i++){
const card=document.createElement("div");
card.className="card coming";
card.style.setProperty("--delay",((i+products.length)*.06)+"s");

card.innerHTML=`
<div class="star">✦</div>
<div class="coming-title">COMING SOON</div>
<div class="coming-text">
New spices and ingredients<br>
are on the way.
</div>
`;

grid.appendChild(card);
}
</script>

</body>
</html>
