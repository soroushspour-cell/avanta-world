<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avanta World | Food</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--mint:#8fffd2;
--blue:#78baff;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;
background:
radial-gradient(circle at 15% 10%,#153e35,transparent 40%),
radial-gradient(circle at 85% 80%,#102b48,transparent 40%),
#07111f;
background-size:200% 200%;
animation:bgMove 14s ease infinite;
overflow-x:hidden;
}

@keyframes bgMove{
0%,100%{background-position:0% 0%}
50%{background-position:100% 100%}
}

header{
position:relative;
z-index:5;
padding:22px 5%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:27px;
font-weight:900;
letter-spacing:2px;
background:linear-gradient(90deg,#7cf5c5,#7abaff,#b7a2ff);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:logoShine 4s linear infinite;
}

@keyframes logoShine{
to{background-position:200% center}
}

nav{display:flex;gap:24px}
nav a{
color:#dce9f6;
text-decoration:none;
transition:.3s;
}
nav a:hover{
color:var(--mint);
text-shadow:0 0 12px var(--mint);
}

.hero{
text-align:center;
padding:65px 20px 45px;
}

.hero h1{
font-size:clamp(42px,7vw,70px);
font-weight:900;
background:linear-gradient(90deg,#8bffd3,#74baff,#c1a2ff,#8bffd3);
background-size:300% auto;
-webkit-background-clip:text;
color:transparent;
animation:titleGlow 5s linear infinite;
}

@keyframes titleGlow{
0%{background-position:0%;filter:drop-shadow(0 0 5px #4eaa8b)}
50%{background-position:100%;filter:drop-shadow(0 0 24px #6caeff)}
100%{background-position:200%;filter:drop-shadow(0 0 5px #4eaa8b)}
}

.hero p{
margin-top:16px;
color:#a9bdd0;
font-size:16px;
animation:fadeUp 1.2s ease both;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.products{
width:92%;
max-width:1600px;
margin:auto;
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:22px;
padding:20px 0 75px;
}

.card{
position:relative;
overflow:hidden;
border-radius:20px;
background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.13);
backdrop-filter:blur(12px);
opacity:0;
animation:cardReveal .8s cubic-bezier(.2,.8,.2,1) forwards;
animation-delay:var(--delay,0s);
transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;
}

@keyframes cardReveal{
from{opacity:0;transform:translateY(45px) scale(.88);filter:blur(5px)}
to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

.card:hover{
transform:translateY(-12px) scale(1.035);
border-color:rgba(143,255,210,.55);
box-shadow:0 20px 45px rgba(0,0,0,.4),0 0 25px rgba(90,255,200,.17);
z-index:2;
}

.card::before{
content:"";
position:absolute;
z-index:3;
top:-50%;
left:-120%;
width:65%;
height:200%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.17),transparent);
transform:rotate(25deg);
pointer-events:none;
}

.card:hover::before{animation:lightSweep .8s ease}

@keyframes lightSweep{
from{left:-120%}
to{left:150%}
}

.product-link{
color:inherit;
text-decoration:none;
display:block;
height:100%;
}

.product-image{
width:100%;
aspect-ratio:1/1;
background:rgba(255,255,255,.06);
overflow:hidden;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
padding:10px;
transition:transform .55s cubic-bezier(.2,.8,.2,1);
}

.card:hover .product-image img{
transform:scale(1.12) rotate(2deg);
}

.info{padding:15px}
.name{
font-size:15px;
font-weight:bold;
line-height:1.5;
min-height:44px;
}
.brand{
font-size:12px;
color:#9fb4c8;
margin-top:7px;
}
.price{
margin-top:11px;
color:var(--mint);
font-weight:bold;
font-size:16px;
}

.coming{
min-height:260px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
background:linear-gradient(145deg,rgba(65,110,140,.15),rgba(90,65,130,.13));
}

.star{
font-size:42px;
margin-bottom:20px;
color:#a7ffe0;
filter:drop-shadow(0 0 12px #7cebd2);
animation:starDance 2.5s ease-in-out infinite;
}

@keyframes starDance{
0%,100%{transform:translateY(0) rotate(0) scale(1)}
50%{transform:translateY(-14px) rotate(180deg) scale(1.2)}
}

.coming-title{
font-size:17px;
font-weight:900;
letter-spacing:3px;
color:#b8dfff;
animation:comingGlow 3s ease-in-out infinite alternate;
}

@keyframes comingGlow{
from{text-shadow:0 0 4px #74baff}
to{text-shadow:0 0 18px #8fffd2}
}

.coming-text{
margin-top:12px;
font-size:13px;
line-height:1.7;
color:#a9bfd1;
}

footer{
border-top:1px solid rgba(255,255,255,.1);
padding:32px 20px;
text-align:center;
color:#94a9bb;
background:rgba(255,255,255,.025);
}

footer a{
display:inline-block;
margin-top:12px;
color:var(--mint);
text-decoration:none;
transition:.3s;
}

footer a:hover{
transform:translateY(-3px);
text-shadow:0 0 12px var(--mint);
}

@media(max-width:1100px){
.products{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media(max-width:750px){
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
header{justify-content:center}
nav{justify-content:center}
.hero{padding-top:42px}
.coming{min-height:220px}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
}
}
</style>
</head>

<body>
