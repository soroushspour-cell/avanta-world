<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVANTA WORLD | CLOTHES</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#080817;
 color:white;
 font-family:Arial,sans-serif;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-3;
 background:
 radial-gradient(circle at 20% 25%,#9b4dff30,transparent 35%),
 radial-gradient(circle at 80% 65%,#168fff30,transparent 35%),
 radial-gradient(circle at 50% 50%,#e04cff12,transparent 55%),
 #080817;
}

body:after{
 content:"";
 position:fixed;
 inset:-50%;
 z-index:-2;
 pointer-events:none;
 background:conic-gradient(
 transparent,#a64dff18,transparent,#168fff20,transparent
 );
 animation:worldSpin 28s linear infinite;
}

@keyframes worldSpin{
 to{transform:rotate(360deg)}
}

nav{
 position:fixed;
 top:18px;
 left:5%;
 width:90%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:17px 25px;
 border:1px solid #ffffff20;
 border-radius:18px;
 background:#111126c9;
 backdrop-filter:blur(18px);
 z-index:20;
}

.logo{
 font-weight:900;
 letter-spacing:3px;
 color:#c38bff;
}

nav a{
 color:#ddd;
 text-decoration:none;
 margin-left:20px;
 font-size:13px;
 transition:.3s;
}

nav a:hover{color:#c38bff}

.hero{
 min-height:720px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:150px 20px 70px;
 position:relative;
 overflow:hidden;
}

.fashion-orbit{
 position:absolute;
 width:290px;
 height:290px;
 border:1px solid #b66bff70;
 border-radius:50%;
 box-shadow:0 0 35px #9b4dff30;
 animation:orbitSpin 12s linear infinite;
}

.fashion-orbit:before,
.fashion-orbit:after{
 content:"";
 position:absolute;
 inset:22px;
 border:1px dashed #168fff90;
 border-radius:50%;
}

.fashion-orbit:after{
 inset:45px;
 border-color:#d46aff80;
}

@keyframes orbitSpin{
 to{transform:rotate(360deg)}
}

.fashion-icon{
 font-size:90px;
 position:relative;
 z-index:2;
 filter:drop-shadow(0 0 25px #b66bff90);
 animation:fashionFloat 3s ease-in-out infinite;
}

@keyframes fashionFloat{
 0%,100%{transform:translateY(0) rotate(-5deg)}
 50%{transform:translateY(-18px) rotate(5deg)}
}

.hero-content{
 position:relative;
 z-index:3;
 margin-top:40px;
}

.tag{
 color:#c38bff;
 letter-spacing:6px;
 font-size:12px;
 margin-bottom:20px;
}

h1{
 font-size:clamp(40px,7vw,78px);
 letter-spacing:3px;
 background:linear-gradient(90deg,#d8a6ff,#55baff,#d8a6ff);
 background-size:200%;
 -webkit-background-clip:text;
 color:transparent;
 animation:gradientMove 4s linear infinite;
}

@keyframes gradientMove{
 to{background-position:200%}
}

.hero p{
 max-width:600px;
 line-height:1.9;
 color:#c0bfd2;
 margin:22px auto 30px;
}

.btn{
 display:inline-block;
 padding:15px 28px;
 border-radius:30px;
 text-decoration:none;
 color:#0d0820;
 font-weight:bold;
 background:linear-gradient(90deg,#d8a6ff,#55baff);
 box-shadow:0 0 25px #9b4dff65;
 transition:.3s;
}

.btn:hover{
 transform:translateY(-5px) scale(1.05);
 box-shadow:0 0 45px #b66bff;
}

/* Falling title */
.intro>*{
 opacity:0;
 animation:fallIn 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}

.intro .tag{animation-delay:.5s}
.intro h1{animation-delay:.85s}
.intro p{animation-delay:1.2s}
.intro .btn{animation-delay:1.55s}

@keyframes fallIn{
 0%{
 opacity:0;
 transform:translateY(-130px) scale(.85);
 filter:blur(12px);
 text-shadow:0 0 30px #c38bff;
 }
 70%{
 opacity:1;
 transform:translateY(12px) scale(1.04);
 filter:blur(0);
 }
 100%{
 opacity:1;
 transform:translateY(0) scale(1);
 filter:blur(0);
 }
}

.collection{
 padding:65px 7% 110px;
 text-align:center;
}

.section-title{
 font-size:34px;
 color:#c38bff;
 margin-bottom:12px;
}

.section-desc{
 color:#aaa9c3;
 margin-bottom:45px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
 max-width:1150px;
 margin:auto;
}

.product{
 height:175px;
 border:1px solid #b66bff35;
 border-radius:20px;
 background:linear-gradient(145deg,#24163899,#101d3699);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
 opacity:0;
 transform:translateY(70px) scale(.85);
 animation:cardEnter .9s cubic-bezier(.2,.8,.2,1) forwards;
 transition:.4s;
}

@keyframes cardEnter{
 to{opacity:1;transform:translateY(0) scale(1)}
}

.product:before{
 content:"";
 position:absolute;
 inset:-100%;
 background:linear-gradient(
 45deg,transparent,#b66bff30,transparent,#168fff30,transparent
 );
 transform:rotate(30deg);
 transition:.7s;
}

.product:hover:before{inset:0}

.product:hover{
 transform:translateY(-9px) scale(1.04);
 border-color:#c38bff;
 box-shadow:0 0 30px #9b4dff45,0 0 45px #168fff25;
}

.coming{
 position:relative;
 z-index:2;
 font-size:14px;
 letter-spacing:4px;
 color:#d8b6ff;
 text-shadow:0 0 18px #b66bff90;
}

footer{
 text-align:center;
 padding:35px 15px;
 border-top:1px solid #ffffff18;
 color:#9291a9;
 font-size:12px;
}

@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 nav{padding:14px}
 nav a{margin-left:10px;font-size:11px}
}

@media(max-width:420px){
 .grid{grid-template-columns:1fr}
 .product{height:145px}
 .fashion-orbit{width:220px;height:220px}
}
</style>
</head>

<body>

<nav>
 <div class="logo">AVANTA WORLD</div>
 <div>
  <a href="index.html">HOME</a>
  <a href="product3.html">CLOTHES</a>
 </div>
</nav>

<main>

<section class="hero">

 <div class="fashion-orbit"></div>

 <div class="fashion-icon">👕</div>

 <div class="hero-content intro">
  <div class="tag">AVANTA WORLD • CATEGORY 03</div>

  <h1>DISCOVER STYLE WORLD</h1>

  <p>
   Style is more than what you wear.
   Enter a new world of creativity, fashion and expression.
  </p>

  <a class="btn" href="index.html">← BACK TO HOME</a>
 </div>

</section>

<section class="collection">

 <h2 class="section-title">THE STYLE COLLECTION</h2>

 <p class="section-desc">
  A new look is coming...
 </p>

 <div class="grid" id="productGrid"></div>

</section>

</main>

<footer>
 © 2026 AVANTA WORLD — ALL RIGHTS RESERVED
</footer>

<script>
const grid=document.getElementById("productGrid");

for(let i=0;i<60;i++){
 const card=document.createElement("div");
 card.className="product";
 card.style.animationDelay=(1.8+i*.055)+"s";

 const text=document.createElement("span");
 text.className="coming";
 text.textContent="COMING SOON";

 card.appendChild(text);
 grid.appendChild(card);
}
</script>

</body>
</html>
