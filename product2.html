<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVANTA WORLD | SPICES</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#080f0b;
 color:white;
 font-family:Arial,sans-serif;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-3;
 background:
 radial-gradient(circle at 20% 30%,#b68b1830,transparent 35%),
 radial-gradient(circle at 80% 65%,#00b98725,transparent 35%),
 radial-gradient(circle at 50% 50%,#087ac020,transparent 55%),
 #080f0b;
}

body:after{
 content:"";
 position:fixed;
 inset:-50%;
 z-index:-2;
 pointer-events:none;
 background:conic-gradient(
 transparent,#e6b94b15,transparent,#00e5a51b,transparent
 );
 animation:worldSpin 30s linear infinite;
}

@keyframes worldSpin{
 to{transform:rotate(360deg)}
}

nav{
 position:fixed;
 top:18px;
 left:5%;
 width:90%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:17px 25px;
 border:1px solid #ffffff20;
 border-radius:18px;
 background:#101a13c9;
 backdrop-filter:blur(18px);
 z-index:20;
}

.logo{
 font-weight:900;
 letter-spacing:3px;
 color:#eac66b;
}

nav a{
 color:#ddd;
 text-decoration:none;
 margin-left:20px;
 font-size:13px;
 transition:.3s;
}

nav a:hover{color:#eac66b}

.hero{
 min-height:720px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:150px 20px 70px;
 position:relative;
 overflow:hidden;
}

.hero-content{
 position:relative;
 z-index:3;
}

.spice-symbol{
 font-size:85px;
 margin-bottom:25px;
 display:inline-block;
 filter:drop-shadow(0 0 25px #eac66b70);
 animation:spiceFloat 3s ease-in-out infinite;
}

@keyframes spiceFloat{
 0%,100%{transform:translateY(0) rotate(-5deg)}
 50%{transform:translateY(-18px) rotate(5deg)}
}

.portal{
 position:absolute;
 width:270px;
 height:270px;
 border:2px solid transparent;
 border-radius:50%;
 background:
 linear-gradient(#080f0b,#080f0b) padding-box,
 conic-gradient(#eac66b,#00e5a5,#168fff,#eac66b) border-box;
 box-shadow:0 0 40px #eac66b40,0 0 100px #00e5a530;
 animation:portal 12s linear infinite;
}

.portal:before,.portal:after{
 content:"";
 position:absolute;
 inset:15px;
 border:1px dashed #eac66b80;
 border-radius:50%;
}

.portal:after{
 inset:35px;
 border-color:#50f5c270;
}

@keyframes portal{
 to{transform:rotate(360deg)}
}

/* Floating spice particles */
.particle{
 position:absolute;
 color:#eac66b;
 font-size:20px;
 opacity:0;
 pointer-events:none;
 animation:particleFly var(--duration) linear infinite;
 animation-delay:var(--delay);
}

@keyframes particleFly{
 0%{opacity:0;transform:translateY(100px) rotate(0) scale(.5)}
 20%{opacity:.8}
 80%{opacity:.65}
 100%{opacity:0;transform:translateY(-450px) rotate(360deg) scale(1.4)}
}

.tag{
 color:#eac66b;
 letter-spacing:6px;
 font-size:12px;
 margin-bottom:20px;
}

h1{
 font-size:clamp(40px,7vw,78px);
 letter-spacing:3px;
 background:linear-gradient(90deg,#f7d98b,#50f5c2,#eac66b);
 background-size:200%;
 -webkit-background-clip:text;
 color:transparent;
 animation:goldGlow 4s linear infinite;
}

@keyframes goldGlow{
 to{background-position:200%}
}

.hero p{
 max-width:600px;
 line-height:1.9;
 color:#c5c9bb;
 margin:22px auto 30px;
}

.btn{
 display:inline-block;
 padding:15px 28px;
 border-radius:30px;
 text-decoration:none;
 color:#151108;
 font-weight:bold;
 background:linear-gradient(90deg,#f2d58b,#50f5c2);
 box-shadow:0 0 25px #eac66b55;
 transition:.3s;
}

.btn:hover{
 transform:translateY(-5px) scale(1.05);
 box-shadow:0 0 45px #eac66b99;
}

/* Falling title */
.intro>*{
 opacity:0;
 animation:fallIn 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}

.intro .tag{animation-delay:.5s}
.intro h1{animation-delay:.85s}
.intro p{animation-delay:1.2s}
.intro .btn{animation-delay:1.55s}

@keyframes fallIn{
 0%{
 opacity:0;
 transform:translateY(-130px) scale(.85);
 filter:blur(12px);
 text-shadow:0 0 30px #eac66b;
 }
 70%{
 opacity:1;
 transform:translateY(12px) scale(1.04);
 filter:blur(0);
 }
 100%{
 opacity:1;
 transform:translateY(0) scale(1);
 filter:blur(0);
 }
}

.collection{
 padding:65px 7% 110px;
 text-align:center;
}

.section-title{
 font-size:34px;
 color:#eac66b;
 margin-bottom:12px;
}

.section-desc{
 color:#b5b8a8;
 margin-bottom:45px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
 max-width:1150px;
 margin:auto;
}

.product{
 height:175px;
 border:1px solid #eac66b30;
 border-radius:20px;
 background:linear-gradient(145deg,#30271799,#10251e99);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
 opacity:0;
 transform:translateY(70px) scale(.85);
 animation:cardEnter .9s cubic-bezier(.2,.8,.2,1) forwards;
 transition:.4s;
}

@keyframes cardEnter{
 to{
 opacity:1;
 transform:translateY(0) scale(1);
 }
}

.product:before{
 content:"";
 position:absolute;
 inset:-100%;
 background:linear-gradient(
 45deg,transparent,#eac66b22,transparent,#50f5c222,transparent
 );
 transform:rotate(30deg);
 transition:.7s;
}

.product:hover:before{
 inset:0;
}

.product:hover{
 transform:translateY(-9px) scale(1.04);
 border-color:#eac66b;
 box-shadow:0 0 30px #eac66b35,0 0 45px #00e5a525;
}

.coming{
 position:relative;
 z-index:2;
 font-size:14px;
 letter-spacing:4px;
 color:#f2d58b;
 text-shadow:0 0 18px #eac66b75;
}

footer{
 text-align:center;
 padding:35px 15px;
 border-top:1px solid #ffffff18;
 color:#9a9c8c;
 font-size:12px;
}

@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 nav{padding:14px}
 nav a{margin-left:10px;font-size:11px}
}

@media(max-width:420px){
 .grid{grid-template-columns:1fr}
 .product{height:145px}
 .portal{width:210px;height:210px}
}
</style>
</head>

<body>

<nav>
 <div class="logo">AVANTA WORLD</div>
 <div>
  <a href="index.html">HOME</a>
  <a href="product2.html">SPICES</a>
 </div>
</nav>

<main>

<section class="hero">

 <div class="portal"></div>

 <div class="hero-content">
  <div class="spice-symbol">🌶️</div>

  <div class="intro">
   <div class="tag">AVANTA WORLD • CATEGORY 02</div>

   <h1>DISCOVER SPICE WORLD</h1>

   <p>
    Discover a universe of aromas, colors and flavors.
    A new journey of taste begins here.
   </p>

   <a class="btn" href="index.html">← BACK TO HOME</a>
  </div>
 </div>

</section>

<section class="collection">

 <h2 class="section-title">THE SPICE COLLECTION</h2>

 <p class="section-desc">
  A world of flavor is on its way...
 </p>

 <div class="grid" id="productGrid"></div>

</section>

</main>

<footer>
 © 2026 AVANTA WORLD — ALL RIGHTS RESERVED
</footer>

<script>
/* Create 60 cards */
const grid=document.getElementById("productGrid");

for(let i=0;i<60;i++){
 const card=document.createElement("div");
 card.className="product";
 card.style.animationDelay=(1.8+i*.055)+"s";

 const text=document.createElement("span");
 text.className="coming";
 text.textContent="COMING SOON";

 card.appendChild(text);
 grid.appendChild(card);
}

/* Floating spice particles */
const symbols=["✦","✧","❋","✺","·","✴"];

for(let i=0;i<35;i++){
 const particle=document.createElement("div");
 particle.className="particle";
 particle.textContent=symbols[i%symbols.length];

 particle.style.left=Math.random()*100+"%";
 particle.style.top=(40+Math.random()*60)+"%";
 particle.style.setProperty("--duration",(5+Math.random()*8)+"s");
 particle.style.setProperty("--delay",(Math.random()*8)+"s");

 document.body.appendChild(particle);
}
</script>

</body>
</html>
